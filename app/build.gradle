plugins { id 'com.android.application' }

// Optional custom signing via keystore.properties or AERA_* environment variables;
// defaults to Android's debug signing config so release APKs build and install anywhere
// (locally and on GitHub Actions) with full R8 shrinking and optimization out of the box.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}
def keyStorePath = System.getenv('AERA_KEYSTORE') ?: signingProps.getProperty('storeFile')
def keyStorePassword = System.getenv('AERA_STORE_PASSWORD') ?: signingProps.getProperty('storePassword')
def keyAliasValue = System.getenv('AERA_KEY_ALIAS') ?: signingProps.getProperty('keyAlias')
def keyPasswordValue = System.getenv('AERA_KEY_PASSWORD') ?: signingProps.getProperty('keyPassword')
def hasCustomKey = keyStorePath != null && rootProject.file(keyStorePath).isFile()

android {
    namespace 'com.aera.read'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aera.read'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        resourceConfigurations += ['en']
    }

    signingConfigs {
        if (hasCustomKey) {
            release {
                storeFile rootProject.file(keyStorePath)
                storePassword keyStorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildFeatures {
        buildConfig false
        resValues false
        shaders false
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig hasCustomKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES',
                         'META-INF/*.kotlin_module', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '384m'
                forkEvery = 8
                def varTmp = new File('/var/tmp')
                def unitTmp = (varTmp.isDirectory() && varTmp.canWrite())
                        ? new File(varTmp, 'aera-unit-tmp')
                        : new File(project.buildDir, 'tmp/unitTestTmp')
                doFirst {
                    unitTmp.deleteDir()
                    unitTmp.mkdirs()
                }
                doLast { unitTmp.deleteDir() }
                jvmArgs "-Djava.io.tmpdir=${unitTmp.absolutePath}"
                jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED',
                        '--add-opens=java.base/java.lang=ALL-UNNAMED',
                        '--add-opens=java.base/java.nio=ALL-UNNAMED'
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'org.jsoup:jsoup:1.17.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
}
