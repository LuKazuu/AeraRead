name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build target'
        required: true
        type: choice
        default: 'Actions only'
        options:
          - 'Actions only'
          - 'Release'
      tag:
        description: 'Release tag (used when Build target is Release)'
        required: false
        type: string
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile R8-optimized APK
        run: ./build.sh apk --no-daemon

      - name: Verify APK signature & manifest
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs AeraRead-1.0.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging AeraRead-1.0.apk | grep "^package:"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeraRead-1.0
          path: AeraRead-1.0.apk

      - name: Tag and publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || 'v1.0' }}
          name: Aera Read ${{ inputs.tag || 'v1.0' }}
          generate_release_notes: true
          files: AeraRead-1.0.apk
