name: Build APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build target'
        required: true
        type: choice
        default: 'Actions only'
        options:
          - 'Actions only'
          - 'Release'
      tag:
        description: 'Release tag (used when Build target is Release)'
        required: false
        type: string
        default: 'v1.1'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 17 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.AERA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret AERA_KEYSTORE_B64 is missing - add your signing secrets first."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aera-release.jks"

      - name: Compile R8-optimized APK
        env:
          AERA_KEYSTORE: ${{ runner.temp }}/aera-release.jks
          AERA_STORE_PASSWORD: ${{ secrets.AERA_STORE_PASSWORD }}
          AERA_KEY_ALIAS: ${{ secrets.AERA_KEY_ALIAS }}
          AERA_KEY_PASSWORD: ${{ secrets.AERA_KEY_PASSWORD }}
        run: |
          sed -i 's/\r$//' build.sh gradlew
          bash build.sh apk --no-daemon

      - name: Verify APK signature & manifest
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs AeraRead-1.1.apk
          BADGING=$("$AAPT2" dump badging AeraRead-1.1.apk)
          echo "$BADGING" | grep "^package:"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeraRead-1.1
          path: AeraRead-1.1.apk

      - name: Tag and publish GitHub Release
        if: inputs.mode == 'Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || 'v1.1' }}
          name: Aera Read ${{ inputs.tag || 'v1.1' }}
          generate_release_notes: true
          files: AeraRead-1.1.apk
